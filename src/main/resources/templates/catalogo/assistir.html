<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${video.titulo})}"></head>
<body>
<div class="app">

    <aside th:replace="~{fragments/layout :: navegacao('catalogo')}"></aside>

    <main class="conteudo">

        <a class="voltar" th:href="${video.publicado} ? @{/catalogo(categoriaId=${video.categoria.id})} : @{/catalogo}">&larr; Voltar ao catálogo</a>

        <th:block th:replace="~{fragments/layout :: alertas}"></th:block>

        <div class="alerta alerta--atencao" role="status" th:unless="${video.publicado}">
            Prévia: este vídeo está com status
            <strong th:text="${video.status.descricao}">Aguardando avaliação</strong>
            e não aparece no catálogo dos alunos. Visualizações de prévia não são contabilizadas.
        </div>

        <article class="assistir">
            <div th:replace="~{fragments/layout :: player(${video})}"></div>

            <div class="assistir__info">
                <div class="assistir__titulo">
                    <h1 th:text="${video.titulo}">Título</h1>
                    <div class="assistir__acoes" th:if="${video.publicado}">
                        <th:block th:if="${session.usuarioLogado.aluno}">
                            <form th:replace="~{fragments/layout :: favorito(${video}, 'assistir__favorito')}"></form>
                        </th:block>
                    </div>
                </div>

                <ul class="etiquetas">
                    <li class="etiqueta" th:text="${video.categoria.nome}">Categoria</li>
                    <li class="etiqueta">Autor: <strong th:text="${video.autor}">Autor</strong></li>
                    <li class="etiqueta">
                        Publicado em <time th:datetime="${video.dataPublicacao}"
                                           th:text="${#temporals.format(video.dataPublicacao, 'dd/MM/yyyy')}">01/01/2026</time>
                    </li>
                </ul>

                <p class="assistir__descricao" th:text="${video.descricao}">Descrição</p>
            </div>
        </article>

        <section class="relacionados" th:unless="${#lists.isEmpty(relacionados)}" aria-labelledby="titulo-relacionados">
            <h2 class="secao__titulo" id="titulo-relacionados" th:text="'Mais vídeos de ' + ${video.categoria.nome}">Mais vídeos</h2>
            <ul class="grade-videos grade-videos--compacta">
                <th:block th:each="v : ${relacionados}">
                    <li th:replace="~{fragments/layout :: cardVideo(${v})}"></li>
                </th:block>
            </ul>
        </section>
    </main>
</div>
</body>
</html>
