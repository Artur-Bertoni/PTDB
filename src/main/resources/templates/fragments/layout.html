<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' - PTDB'">PTDB</title>
    <link rel="stylesheet" th:href="@{/css/ptdb.css}">
    <script th:src="@{/js/ptdb.js}" defer></script>
</head>
<body>

<aside th:fragment="navegacao(ativo)" class="navegacao">
    <a class="navegacao__marca" th:href="@{/}">
        <span class="navegacao__logo" aria-hidden="true">DB</span>
        <span class="navegacao__nome">
            <strong>PTDB</strong>
            <small>Portal de Treinamento Dom Bosco</small>
        </span>
    </a>

    <nav class="navegacao__menu" aria-label="Menu principal" th:if="${session.usuarioLogado != null}">
        <a class="navegacao__link"
           th:href="@{/catalogo}"
           th:classappend="${ativo == 'catalogo'} ? 'navegacao__link--ativo'"
           th:aria-current="${ativo == 'catalogo'} ? 'page'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="3" width="7" height="7" rx="1.5"/>
                <rect x="14" y="3" width="7" height="7" rx="1.5"/>
                <rect x="3" y="14" width="7" height="7" rx="1.5"/>
                <rect x="14" y="14" width="7" height="7" rx="1.5"/>
            </svg>
            Catálogo
        </a>

        <a class="navegacao__link" th:if="${session.usuarioLogado.aluno}"
           th:href="@{/favoritos}"
           th:classappend="${ativo == 'favoritos'} ? 'navegacao__link--ativo'"
           th:aria-current="${ativo == 'favoritos'} ? 'page'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>
            </svg>
            Meus favoritos
        </a>

        <th:block th:if="${session.usuarioLogado.avaliador}">
            <a class="navegacao__link"
               th:href="@{/avaliacao}"
               th:classappend="${ativo == 'avaliacao'} ? 'navegacao__link--ativo'"
               th:aria-current="${ativo == 'avaliacao'} ? 'page'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 11l3 3 8-8"/>
                    <path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>
                </svg>
                Fila de avaliação
            </a>
            <a class="navegacao__link"
               th:href="@{/avaliacao/historico}"
               th:classappend="${ativo == 'historico'} ? 'navegacao__link--ativo'"
               th:aria-current="${ativo == 'historico'} ? 'page'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"/>
                    <path d="M12 7v5l3 2"/>
                </svg>
                Histórico de avaliações
            </a>
        </th:block>

        <th:block th:if="${session.usuarioLogado.administrador}">
            <span class="navegacao__secao">Gestão</span>
            <a class="navegacao__link"
               th:href="@{/admin}"
               th:classappend="${ativo == 'painel'} ? 'navegacao__link--ativo'"
               th:aria-current="${ativo == 'painel'} ? 'page'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 3v18h18"/>
                    <path d="M7 15l4-4 3 3 5-6"/>
                </svg>
                Painel
            </a>
            <a class="navegacao__link"
               th:href="@{/admin/videos}"
               th:classappend="${ativo == 'videos'} ? 'navegacao__link--ativo'"
               th:aria-current="${ativo == 'videos'} ? 'page'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="2" y="5" width="15" height="14" rx="2"/>
                    <path d="M17 10l5-3v10l-5-3z"/>
                </svg>
                Gerenciar vídeos
            </a>
            <a class="navegacao__link"
               th:href="@{/admin/categorias}"
               th:classappend="${ativo == 'categorias'} ? 'navegacao__link--ativo'"
               th:aria-current="${ativo == 'categorias'} ? 'page'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 6h16M4 12h16M4 18h10"/>
                </svg>
                Gerenciar categorias
            </a>
            <a class="navegacao__link"
               th:href="@{/admin/faq}"
               th:classappend="${ativo == 'faq-admin'} ? 'navegacao__link--ativo'"
               th:aria-current="${ativo == 'faq-admin'} ? 'page'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"/>
                    <path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7M12 17h.01"/>
                </svg>
                Gerenciar FAQ
            </a>
        </th:block>

        <span class="navegacao__secao">Suporte</span>
        <a class="navegacao__link"
           th:href="@{/faq}"
           th:classappend="${ativo == 'faq'} ? 'navegacao__link--ativo'"
           th:aria-current="${ativo == 'faq'} ? 'page'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            FAQ
        </a>
    </nav>

    <div class="navegacao__usuario" th:if="${session.usuarioLogado != null}">
        <div class="navegacao__identificacao">
            <span class="navegacao__avatar" aria-hidden="true" th:text="${session.usuarioLogado.iniciais}">AD</span>
            <span class="navegacao__perfil">
                <strong th:text="${session.usuarioLogado.nome}">Usuário</strong>
                <small th:text="${session.usuarioLogado.perfil.descricao}">Perfil</small>
            </span>
        </div>
        <form class="navegacao__trocar" th:action="@{/perfil}" method="post">
            <label class="visualmente-oculto" for="perfil">Trocar perfil</label>
            <select class="campo__input" id="perfil" name="perfil">
                <option value="ALUNO" th:selected="${session.usuarioLogado.aluno}">Aluno</option>
                <option value="AVALIADOR" th:selected="${session.usuarioLogado.avaliador}">Avaliador</option>
                <option value="ADMINISTRADOR" th:selected="${session.usuarioLogado.administrador}">Administrador</option>
            </select>
            <button class="botao botao--secundario botao--pequeno" type="submit">Trocar</button>
        </form>
    </div>
</aside>

<th:block th:fragment="alertas">
    <div class="alerta alerta--sucesso" role="status" th:if="${mensagem}" th:text="${mensagem}"></div>
    <div class="alerta alerta--erro" role="alert" th:if="${erro}" th:text="${erro}"></div>
</th:block>

<form th:fragment="favorito(v, classe)" th:class="'alternancia ' + ${classe}" method="post"
      th:action="@{/favoritos/{id}(id=${v.id})}">
    <button type="submit" class="favorito"
            th:classappend="${favoritos.contains(v.id)} ? 'favorito--marcado'"
            th:aria-pressed="${favoritos.contains(v.id)}"
            th:title="${favoritos.contains(v.id)} ? 'Remover dos favoritos' : 'Adicionar aos favoritos'"
            th:aria-label="'Favoritar ' + ${v.titulo}">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>
        </svg>
    </button>
</form>

<div th:fragment="player(video)" class="player">
    <video th:if="${video.arquivo}" controls preload="metadata"
           th:src="@{/midia/videos/{n}(n=${video.arquivoLink})}"
           th:poster="${video.imagemCapa != null} ? @{/midia/capas/{n}(n=${video.imagemCapa})} : null">
        Seu navegador não consegue reproduzir este vídeo.
    </video>
    <iframe th:if="${video.link and video.embed != null}" th:src="${video.embed}"
            th:title="${video.titulo}" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen></iframe>
    <div class="player__externo" th:if="${video.link and video.embed == null}">
        <img th:if="${video.imagemCapa != null}" th:src="@{/midia/capas/{n}(n=${video.imagemCapa})}" alt="">
        <a class="botao botao--primario" th:href="${video.arquivoLink}" target="_blank" rel="noopener">
            Abrir vídeo no site de origem &nearr;
        </a>
    </div>
</div>

<li th:fragment="cardVideo(v)" class="card-video">
    <div class="card-video__capa">
        <a class="card-video__link" th:href="@{/videos/{id}(id=${v.id})}" th:aria-label="'Assistir ' + ${v.titulo}">
            <img th:if="${v.imagemCapa != null}" th:src="@{/midia/capas/{n}(n=${v.imagemCapa})}" alt="" loading="lazy">
            <img th:if="${v.imagemCapa == null and v.capaExterna != null}" th:src="${v.capaExterna}" alt="" loading="lazy">
            <span class="card-video__play" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
            </span>
        </a>
        <th:block th:if="${session.usuarioLogado.aluno}">
            <form th:replace="~{fragments/layout :: favorito(${v}, 'card-video__favorito')}"></form>
        </th:block>
    </div>
    <div class="card-video__corpo">
        <h3 class="card-video__titulo">
            <a th:href="@{/videos/{id}(id=${v.id})}" th:text="${v.titulo}">Título</a>
        </h3>
        <span class="card-video__categoria" th:text="${v.categoria.nome}">Categoria</span>
        <span class="card-video__meta">
            <span th:text="${v.autor}">Autor</span> ·
            publicado em <time th:datetime="${v.dataPublicacao}"
                               th:text="${#temporals.format(v.dataPublicacao, 'dd/MM/yyyy')}">01/01/2026</time>
        </span>
    </div>
</li>

</body>
</html>
