<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' - PTDB'">PTDB</title>
    <link rel="stylesheet" th:href="@{/css/ptdb.css}">
    <script th:src="@{/js/ptdb.js}" defer></script>
</head>
<body>

<aside th:fragment="navegacao(ativo)" class="navegacao">
    <a class="navegacao__marca" th:href="@{/}">
        <span class="navegacao__logo" aria-hidden="true">DB</span>
        <span class="navegacao__nome">
            <strong>PTDB</strong>
            <small>Portal de Treinamento Dom Bosco</small>
        </span>
    </a>

    <nav class="navegacao__menu" aria-label="Menu principal">
        <a class="navegacao__link"
           th:href="@{/admin}"
           th:classappend="${ativo == 'painel'} ? 'navegacao__link--ativo'"
           th:aria-current="${ativo == 'painel'} ? 'page'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="3" width="7" height="7" rx="1.5"/>
                <rect x="14" y="3" width="7" height="7" rx="1.5"/>
                <rect x="3" y="14" width="7" height="7" rx="1.5"/>
                <rect x="14" y="14" width="7" height="7" rx="1.5"/>
            </svg>
            Painel
        </a>
        <a class="navegacao__link"
           th:href="@{/admin/videos}"
           th:classappend="${ativo == 'videos'} ? 'navegacao__link--ativo'"
           th:aria-current="${ativo == 'videos'} ? 'page'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2" y="5" width="15" height="14" rx="2"/>
                <path d="M17 10l5-3v10l-5-3z"/>
            </svg>
            Gerenciar vídeos
        </a>
        <span class="navegacao__link navegacao__link--desabilitado" aria-disabled="true" title="Disponível em breve">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 6h16M4 12h16M4 18h10"/>
            </svg>
            Gerenciar categorias
        </span>
        <span class="navegacao__link navegacao__link--desabilitado" aria-disabled="true" title="Disponível em breve">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9"/>
                <path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7M12 17h.01"/>
            </svg>
            Gerenciar FAQ
        </span>

        <span class="navegacao__secao">Conta</span>
        <span class="navegacao__link navegacao__link--desabilitado" aria-disabled="true" title="Disponível em breve">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
            </svg>
            Configurações
        </span>
        <span class="navegacao__link navegacao__link--desabilitado" aria-disabled="true" title="Disponível em breve">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
            </svg>
            Sair
        </span>
    </nav>

    <div class="navegacao__usuario">
        <span class="navegacao__avatar" aria-hidden="true">AD</span>
        <strong>Administrador</strong>
    </div>
</aside>

</body>
</html>
