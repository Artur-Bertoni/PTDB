<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Meus favoritos')}"></head>
<body>
<div class="app">

    <aside th:replace="~{fragments/layout :: navegacao('favoritos')}"></aside>

    <main class="conteudo">

        <header class="pagina__cabecalho">
            <div>
                <h1>Meus favoritos</h1>
                <p class="pagina__descricao">Vídeos que você marcou para assistir depois.</p>
            </div>
            <span class="selo selo--destaque"
                  th:text="${#lists.size(videos) == 1} ? '1 vídeo favoritado' : ${#lists.size(videos)} + ' vídeos favoritados'">0 vídeos favoritados</span>
        </header>

        <th:block th:replace="~{fragments/layout :: alertas}"></th:block>

        <div class="vazio" th:if="${#lists.isEmpty(videos)}">
            <strong>Você ainda não tem favoritos.</strong>
            Toque no coração de um vídeo no <a th:href="@{/catalogo}">catálogo</a> para guardá-lo aqui.
        </div>

        <ul class="grade-videos" th:unless="${#lists.isEmpty(videos)}" data-lista-favoritos>
            <th:block th:each="v : ${videos}">
                <li th:replace="~{fragments/layout :: cardVideo(${v})}"></li>
            </th:block>
        </ul>
    </main>
</div>
</body>
</html>
