<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Histórico de avaliações')}"></head>
<body>
<div class="app">

    <aside th:replace="~{fragments/layout :: navegacao('historico')}"></aside>

    <main class="conteudo">

        <header class="pagina__cabecalho">
            <div>
                <h1>Histórico de avaliações</h1>
                <p class="pagina__descricao">Decisões registradas pelos avaliadores, da mais recente para a mais antiga.</p>
            </div>
            <a class="botao botao--secundario" th:href="@{/avaliacao}"
               th:text="'Fila de avaliação (' + ${pendentes} + ')'">Fila de avaliação</a>
        </header>

        <section class="painel painel--tabela" aria-labelledby="titulo-historico">
            <div class="painel__cabecalho">
                <h2 id="titulo-historico">Avaliações</h2>
                <span class="contador"
                      th:text="${#lists.size(avaliacoes) == 1} ? '1 avaliação' : ${#lists.size(avaliacoes)} + ' avaliações'"></span>
            </div>

            <div class="vazio" th:if="${#lists.isEmpty(avaliacoes)}">
                <strong>Nenhuma avaliação registrada.</strong>
            </div>

            <table class="tabela" th:unless="${#lists.isEmpty(avaliacoes)}">
                <thead>
                <tr>
                    <th scope="col">Vídeo</th>
                    <th scope="col">Decisão</th>
                    <th scope="col">Parecer</th>
                    <th scope="col">Avaliador</th>
                    <th scope="col">Data</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${avaliacoes}">
                    <td>
                        <div class="tabela__video-texto">
                            <strong th:text="${a.video.titulo}">Título</strong>
                            <span th:text="${a.video.categoria.nome}">Categoria</span>
                        </div>
                    </td>
                    <td data-rotulo="Decisão">
                        <span class="selo" th:classappend="${'selo--' + #strings.toLowerCase(a.decisao.statusResultante.name())}"
                              th:text="${a.decisao.descricao}">Decisão</span>
                    </td>
                    <td data-rotulo="Parecer" class="tabela__parecer" th:text="${a.parecer}">Parecer</td>
                    <td data-rotulo="Avaliador" th:text="${a.avaliador.nome}">Avaliador</td>
                    <td data-rotulo="Data">
                        <time th:datetime="${a.data}" th:text="${#temporals.format(a.data, 'dd/MM/yyyy HH:mm')}">01/01/2026</time>
                    </td>
                </tr>
                </tbody>
            </table>
        </section>
    </main>
</div>
</body>
</html>
