spring.application.name=PTDB

spring.datasource.url=${PTDB_DB_URL:jdbc:mysql://localhost:3306/portal_videos?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${PTDB_DB_USUARIO:root}
spring.datasource.password=${PTDB_DB_SENHA:123456}

spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

spring.mvc.format.date=iso

server.servlet.session.tracking-modes=cookie

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=520MB

ptdb.storage.location=uploads
