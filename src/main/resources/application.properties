# ============================================================
# PTDB - Portal de Treinamento Dom Bosco
# Configuracao de desenvolvimento (RF06 - Manter videos)
# ============================================================

spring.application.name=PTDB

# ---- Banco de dados H2 em memoria (dev) - base para o RF10 ----
spring.datasource.url=jdbc:h2:mem:ptdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Console web do H2 disponivel em /h2-console (somente dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- Thymeleaf ----
spring.thymeleaf.cache=false

# ---- Upload de arquivos (video + thumbnail) ----
# RF06: campo arquivo do video e imagem de capa sao enviados por upload.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=520MB

# Diretorio raiz onde os uploads sao gravados (fora do classpath)
ptdb.storage.location=uploads

# ---- Placeholder de autenticacao (sera substituido por RF01/RF02) ----
# Enquanto login/perfis nao existem, este flag simula um Administrador
# autenticado para permitir o uso ponta a ponta do RF06 em dev.
# DEVE ser desligado quando RF01/RF02 forem implementados.
ptdb.dev.auto-admin=true
