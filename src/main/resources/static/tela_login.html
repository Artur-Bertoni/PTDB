<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Faculdade Dom Bosco</title>
    <link rel="stylesheet" href="/css/tela_login.css">
</head>

<body>

    <header class="top-bar">

        <div class="logo-box">
            <img src="/img/logo-faculdade-dom-bosco.png" alt="Faculdade Dom Bosco">
        </div>

    </header>

    <main class="login-container">

        <section class="login-box">

            <form id="loginForm">

                <div class="form-group">

                    <input
                        type="text"
                        id="usuario"
                        placeholder="Matrícula ou E-mail"
                        required>

                </div>

                <div class="form-group senha-box">

                    <input
                        type="password"
                        id="senha"
                        placeholder="Senha"
                        required>

                    <span id="mostrarSenha">👁</span>

                </div>

                <button type="submit" id="btnLogin">
                    ENTRAR
                </button>

            </form>

            <p id="message"></p>

            <form class="simulacao" method="post" action="/perfil">

                <p>SIMULAR LOGIN (PROVISÓRIO)</p>

                <div class="form-group">

                    <select name="perfil" aria-label="Perfil para simular">
                        <option value="ALUNO">Aluno</option>
                        <option value="AVALIADOR">Avaliador</option>
                        <option value="ADMINISTRADOR">Administrador</option>
                    </select>

                </div>

                <button type="submit">
                    ENTRAR COMO
                </button>

            </form>

        </section>

    </main>

    <script src="/js/tela_login.js"></script>

</body>

</html>
