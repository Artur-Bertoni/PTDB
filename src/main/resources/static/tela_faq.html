<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ - Portal Acadêmico de Vídeos</title>
    <link rel="stylesheet" href="/css/estilo.css">
</head>

<body>

    <header class="cabecalho" id="cabecalho"></header>

    <main>

        <section class="titulo">
            <div>
                <h1>FAQ / Dúvidas Frequentes</h1>
                <p>Respostas para as dúvidas mais comuns sobre o portal.</p>
            </div>
        </section>

        <section class="filtros">
            <input type="text" id="pesquisa" placeholder="Pesquisar pergunta ou resposta...">
            <select id="filtroTema">
                <option value="">Todos os temas</option>
            </select>
        </section>

        <section id="perguntas"></section>
        <p id="semPerguntas" class="vazio"></p>

    </main>

    <footer class="rodape" id="rodape"></footer>

    <script src="/js/comum.js"></script>
    <script src="/js/tela_faq.js"></script>

</body>

</html>
